[package]
name = "keyreeve"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rotate API keys on your own machine, with recipes the community writes for each provider."
repository = "https://github.com/carlostapiacl/keyreeve"
keywords = ["secrets", "rotation", "api-keys", "security", "cli"]
categories = ["command-line-utilities"]

[dependencies]
hmac = "0.12"
# The proxy that lets a command use a key it never holds. It terminates TLS for that key's hosts, with
# a CA made for each run. rustls, ring and webpki-roots already come with ureq.
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1.0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9.42"
sha2 = "0.10"
ureq = "3.5"
zeroize = "1.9"

[lints.rust]
unsafe_code = "forbid"
