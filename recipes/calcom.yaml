schema: 1
provider: calcom
name: Cal.com
dashboard: https://app.cal.com/settings/developer/api-keys
prefixes: [cal_live_, cal_]
rotate_every_days: 365
criticality_hint: 2
tested: { check: 2026-11 }
env_var: CALCOM_API_KEY
hosts: [api.cal.com]
auth: { header: Authorization, prefix: "Bearer " }
verify: { method: GET, path: /v2/me }
identify:
  request: { method: GET, path: /v2/me }
  fields: { account: $.data.email, name: $.data.username }
suggested_name: "Cal.com · {account}"
# Refreshing ends the old key at once, and the answer has no id. Whether this works outside a managed
# organization is not confirmed.
rotation: single
create:
  method: POST
  path: /v2/api-keys/refresh
  body: {}
  value_from: $.data.apiKey
