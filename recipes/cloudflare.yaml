schema: 1
provider: cloudflare
name: Cloudflare
dashboard: https://dash.cloudflare.com/profile/api-tokens
prefixes: []
rotate_every_days: 180
criticality_hint: 4
tested: { check: 2026-11 }
env_var: CLOUDFLARE_API_TOKEN
hosts: [api.cloudflare.com]
auth: { header: Authorization, prefix: "Bearer " }
# This works for tokens of a user and of an account, unlike /user/tokens/verify.
verify: { method: GET, path: "/client/v4/accounts?per_page=1", reject: [400, 403] }
identify:
  request: { method: GET, path: "/client/v4/accounts?per_page=1" }
  fields: { account: $.result.0.name, id: $.result.0.id }
suggested_name: "Cloudflare · {account}"
