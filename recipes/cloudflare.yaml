schema: 1
provider: cloudflare
name: Cloudflare
dashboard: https://dash.cloudflare.com/profile/api-tokens
prefixes: []
rotate_every_days: 180
criticality_hint: 4
hosts: [api.cloudflare.com]
auth: { header: Authorization, prefix: "Bearer " }
verify: { method: GET, path: /client/v4/user/tokens/verify }
identify:
  request: { method: GET, path: /client/v4/user }
  fields: { account: $.result.email, id: $.result.id }
suggested_name: "Cloudflare · {account}"
