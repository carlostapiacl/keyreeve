schema: 1
provider: github-deploy
name: GitHub deploy key
dashboard: https://github.com/settings/keys
rotate_every_days: 365
criticality_hint: 3
hosts: [github.com]
# An SSH key. GitHub answers with the repository or account it belongs to.
auth: { type: ssh, user: git, reply_between: ["Hi ", "!"] }
verify: { method: GET, path: / }
identify:
  request: { method: GET, path: / }
  fields: { account: "reply:" }
suggested_name: "GitHub deploy · {account}"
