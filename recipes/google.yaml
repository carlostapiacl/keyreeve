schema: 1
provider: google
name: Google account
dashboard: https://console.cloud.google.com/apis/credentials
rotate_every_days: 365
criticality_hint: 4
tested: { check: 2026-11 }
# The token host, then the APIs a command may reach with the access token the proxy gets for it.
hosts:
  - oauth2.googleapis.com
  - www.googleapis.com
  - searchconsole.googleapis.com
  - gmail.googleapis.com
  - drive.googleapis.com
  - youtube.googleapis.com
  - sheets.googleapis.com
  - docs.googleapis.com
  - analyticsdata.googleapis.com
  - analyticsadmin.googleapis.com
  - people.googleapis.com
# The path of a credentials file with stand-ins, as Google's libraries read it.
env_var: GOOGLE_APPLICATION_CREDENTIALS
# The key is three fields: client id, client secret and refresh token, such as gcloud's authorized_user file. Getting a
# short-lived token proves they work.
auth: { type: oauth_token, grant: refresh_token, token_host: oauth2.googleapis.com, token_path: /token, token_is_proof: true, client_id_ends: .apps.googleusercontent.com }
verify: { method: GET, host: www.googleapis.com, path: /oauth2/v3/userinfo }
identify:
  request: { method: GET, host: www.googleapis.com, path: /oauth2/v3/userinfo }
  fields: { account: $.email, name: $.name, scopes: "token:scope" }
suggested_name: "Google · {account}"
