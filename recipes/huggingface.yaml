schema: 1
provider: huggingface
name: Hugging Face
dashboard: https://huggingface.co/settings/tokens
prefixes: [hf_]
rotate_every_days: 365
criticality_hint: 2
tested: { check: 2026-11 }
env_var: HF_TOKEN
hosts: [huggingface.co]
auth: { header: Authorization, prefix: "Bearer " }
verify: { method: GET, path: /api/whoami-v2 }
identify:
  request: { method: GET, path: /api/whoami-v2 }
  fields: { account: $.name, email: $.email, scopes: $.auth.accessToken.role }
suggested_name: "Hugging Face · {account}"
