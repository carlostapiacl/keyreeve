schema: 1
provider: instagram
name: Instagram
dashboard: https://developers.facebook.com/apps
prefixes: []
hosts: [graph.instagram.com]
auth: { header: Authorization, prefix: "Bearer " }
verify: { method: GET, path: /me, reject: [400] }
identify:
  request: { method: GET, path: "/me?fields=id,username" }
  fields: { account: $.username, id: $.id }
suggested_name: "Instagram · {account}"
