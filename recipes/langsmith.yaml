schema: 1
provider: langsmith
name: LangSmith
dashboard: https://smith.langchain.com/settings
prefixes: []
rotate_every_days: 365
criticality_hint: 2
tested: { check: 2026-11 }
env_var: LANGSMITH_API_KEY
hosts: [api.smith.langchain.com]
auth: { header: x-api-key, prefix: "" }
verify: { method: GET, path: "/api/v1/sessions?limit=1", reject: [403] }
# An organization can forbid a key from creating keys. It answers 403, and nothing changes.
create:
  method: POST
  path: /api/v1/api-key
  body: { description: "{key_name}" }
  value_from: $.key
  id_from: $.id
revoke: { method: DELETE, path: "/api/v1/api-key/{id}" }
