schema: 1
provider: mailerlite-classic
name: MailerLite Classic
dashboard: https://app.mailerlite.com/integrations/api/
rotate_every_days: 365
criticality_hint: 2
hosts: [api.mailerlite.com]
auth: { header: X-MailerLite-ApiKey }
verify: { method: GET, path: /api/v2/me }
identify:
  request: { method: GET, path: /api/v2/me }
  fields: { account: $.account.email, name: $.account.name }
suggested_name: "MailerLite · {account}"
