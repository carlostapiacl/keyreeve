schema: 1
provider: meta
name: Meta
dashboard: https://developers.facebook.com/apps
prefixes: []
hosts: [graph.facebook.com]
auth: { header: Authorization, prefix: "Bearer " }
verify: { method: GET, path: /me, reject: [400] }
identify:
  request: { method: GET, path: "/me?fields=id,name" }
  fields: { account: $.name, id: $.id }
suggested_name: "Meta · {account}"
