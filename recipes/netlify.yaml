schema: 1
provider: netlify
name: Netlify
dashboard: https://app.netlify.com/user/applications
prefixes: [nfp_]
rotate_every_days: 180
criticality_hint: 4
hosts: [api.netlify.com]
auth: { header: Authorization, prefix: "Bearer " }
verify: { method: GET, path: /api/v1/user }
identify:
  request: { method: GET, path: /api/v1/user }
  fields: { account: $.email, name: $.full_name }
suggested_name: "Netlify · {account}"
