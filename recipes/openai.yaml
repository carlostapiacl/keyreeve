schema: 1
provider: openai
name: OpenAI
dashboard: https://platform.openai.com/api-keys
prefixes: [sk-proj-, sk-svcacct-, sk-admin-]
rotate_every_days: 180
criticality_hint: 3
tested: { check: 2026-11 }
env_var: OPENAI_API_KEY
hosts: [api.openai.com]
auth: { header: Authorization, prefix: "Bearer " }
verify: { method: GET, path: /v1/models }
identify:
  request: { method: GET, path: /v1/me }
  fields: { account: $.email, name: $.name }
suggested_name: "OpenAI · {account}"
