schema: 1
provider: r2
name: Cloudflare R2
dashboard: https://dash.cloudflare.com/?to=/:account/r2/api-tokens
rotate_every_days: 365
criticality_hint: 4
# The address is your own: ACCOUNT.r2.cloudflarestorage.com. The key is two fields: access key id and secret.
self_hosted: true
hosts: []
auth: { type: aws_sigv4, service: s3, region: auto }
verify: { method: GET, path: "/?x-id=ListBuckets" }
