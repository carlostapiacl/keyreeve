schema: 1
provider: sentry
name: Sentry
dashboard: https://sentry.io/settings/account/api/auth-tokens/
prefixes: [sntrys_, sntryu_]
rotate_every_days: 365
criticality_hint: 2
tested: { check: 2026-11 }
env_var: SENTRY_AUTH_TOKEN
hosts: [sentry.io]
auth: { header: Authorization, prefix: "Bearer " }
verify: { method: GET, path: /api/0/organizations/ }
identify:
  request: { method: GET, path: /api/0/organizations/ }
  # A user token sees every organization of its person, so all of them are kept, not only the first.
  fields: { account: $.0.slug, name: $.0.name, organizations: "$.*.slug" }
suggested_name: "Sentry · {account}"
