schema: 1
provider: supabase
name: Supabase
dashboard: https://supabase.com/dashboard/account/tokens
prefixes: [sbp_]
rotate_every_days: 180
criticality_hint: 4
tested: { check: 2026-11 }
env_var: SUPABASE_ACCESS_TOKEN
hosts: [api.supabase.com]
auth: { header: Authorization, prefix: "Bearer " }
verify: { method: GET, path: /v1/projects }
identify:
  request: { method: GET, path: /v1/organizations }
  fields: { account: $.0.name, id: $.0.id }
suggested_name: "Supabase · {account}"
