schema: 1
provider: telegram
name: Telegram bot
dashboard: https://t.me/BotFather
rotate_every_days: 365
criticality_hint: 2
tested: { check: 2026-11 }
env_var: TELEGRAM_BOT_TOKEN
hosts: [api.telegram.org]
# Telegram takes the token in the address, and has no other way.
auth: { type: url }
verify: { method: GET, path: "/bot{key}/getMe", reject: [404] }
identify:
  request: { method: GET, path: "/bot{key}/getMe" }
  fields: { account: $.result.username, name: $.result.first_name, id: $.result.id }
suggested_name: "Telegram · @{account}"
